<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- App manifest: full navy icon (fills the home-screen shape) and a navy launch screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131D47" />
    <meta name="apple-mobile-web-app-title" content="RCM Flowmotive" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RCM Automotive</title>
    <link href="https://fonts.cdnfonts.com/css/uk-number-plate" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
